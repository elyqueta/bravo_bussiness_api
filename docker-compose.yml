services:
  postgres:
    image: postgres:16-alpine
    container_name: bravo_business_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bravo_user
      POSTGRES_PASSWORD: bravo_password
      POSTGRES_DB: bravo_business
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - bravo_business_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bravo_user -d bravo_business']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bravo_business_postgres_data:
